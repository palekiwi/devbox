---
- name: Remove uneeded directories.
  ansible.builtin.file:
    name: "{{ item }}"
    state: absent
  loop: "{{ dirs_remove }}"

- name: Ensure directories exist.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ dirs_create }}"

- name: Create soft links.
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop: "{{ dirs_link }}"
